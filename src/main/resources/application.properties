spring.application.name=sentinelai

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.profiles.default=local


spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=phi:latest
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.init.pull-model-strategy=never

# Spring AI HTTP client timeouts
spring.ai.ollama.client.connect-timeout=5s
spring.ai.ollama.client.read-timeout=120s



# Spring AI retry configuration
spring.ai.retry.max-attempts=1
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.multiplier=1
spring.ai.retry.backoff.max-interval=1s

